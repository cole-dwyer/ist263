<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Title Goes Here</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @media only screen and (min-width: 801px) {
            .large {display: block;}
            .small {display: none;}
        }
        @media only screen and (max-width: 800px) {
            .small {display: block;}
            .large {display: none;}
        }
    </style>
</head>

<body>
    <h1>Header</h1>
    <p class="large">I'm large</p>
    <p class="small">I'm small</p>
</body>

</html>
