<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Title Goes Here</title>
    <script>
        function changeText () {
            document.getElementById("div").innerHTML = "<span style='color: orange;'>Orange Nation</span>"
        }
    </script>
</head>

<body>
    <div id="div" onclick="changeText();">Syracuse University</div>
</body>

</html>
